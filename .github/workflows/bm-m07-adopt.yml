name: bm-m07-adopt
run-name: ${{ inputs.helio_execution_id }}
on:
  push:
    branches: [main, 'feature/**']
    paths: ['.github/workflows/bm-m07-adopt.yml', 'bm-m07/**']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      environment: {required: false, type: string}
      helio_execution_id: {required: false, type: string}
      helio_release_id: {required: false, type: string}
      workflow_revision: {required: false, type: string}
      release_version: {required: false, type: string}
  pull_request:
    paths: ['bm-m07/**']
permissions:
  contents: read
concurrency:
  group: bm-m07-adopt-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: BlueMatrix module 07 adoption fixture (build)
        shell: bash
        run: sleep 150
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bm-m07-test
    steps:
      - name: BlueMatrix module 07 adoption fixture (test)
        shell: bash
        run: sleep 20
