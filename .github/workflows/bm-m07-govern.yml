name: bm-m07-govern
run-name: ${{ inputs.helio_execution_id }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bm-m07-govern.yml', 'bm-m07-govern/**']
  workflow_dispatch:
    inputs:
      environment: {required: false, type: string}
      helio_execution_id: {required: false, type: string}
      helio_release_id: {required: false, type: string}
      workflow_revision: {required: false, type: string}
      release_version: {required: false, type: string}
permissions:
  contents: read
  deployments: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: BlueMatrix module 07 governed adoption fixture (build)
        shell: bash
        run: sleep 10
  preprod:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bm-m07-preprod
    steps:
      - name: Deploy to preprod (synthetic)
        shell: bash
        run: sleep 10
  production:
    needs: preprod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bm-m07-production
    steps:
      - name: Deploy to production (synthetic)
        shell: bash
        run: sleep 10
