name: bm-m07-matrix
run-name: ${{ inputs.helio_execution_id }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bm-m07-matrix.yml', 'bm-m07-matrix/**']
  workflow_dispatch:
    inputs:
      environment: {required: false, type: string}
      helio_execution_id: {required: false, type: string}
      helio_release_id: {required: false, type: string}
      workflow_revision: {required: false, type: string}
      release_version: {required: false, type: string}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: bm-m07-test
    strategy:
      matrix:
        shard: [a, b]
    steps:
      - name: BlueMatrix module 07 matrix fixture
        shell: bash
        run: sleep 120
