name: bm-m07-reusable-caller
run-name: ${{ inputs.helio_execution_id }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bm-m07-reusable-caller.yml', 'bm-m07-reusable/**']
  workflow_dispatch:
    inputs:
      environment: {required: false, type: string}
      helio_execution_id: {required: false, type: string}
      helio_release_id: {required: false, type: string}
      workflow_revision: {required: false, type: string}
      release_version: {required: false, type: string}
permissions:
  contents: read
jobs:
  call:
    uses: ./.github/workflows/bm-m07-reusable.yml
  test:
    needs: call
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: bm-m07-test
    steps:
      - name: BlueMatrix module 07 reusable caller (test)
        shell: bash
        run: sleep 5
